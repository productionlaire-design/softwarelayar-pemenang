name: Build Flutter Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Prepare Project and Clean
        run: |
          # 1. Hapus folder windows sisa error
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          
          # 2. Paksa konfigurasi pubspec dengan versi yang benar
          $pubspec = @"
          name: pengumuman_pro
          description: Professional Broadcast System
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            desktop_multi_window: ^0.2.0
            file_picker: ^8.0.0
            video_player: ^2.8.3
            window_manager: ^0.3.8
            shared_preferences: ^2.2.2
          flutter:
            uses-material-design: true
          "@
          Set-Content -Path pubspec.yaml -Value $pubspec
          
          # 3. Buat kerangka windows baru yang 100% bawaan pabrik terbaru
          flutter create --project-name pengumuman_pro --platforms=windows .
          
          # 4. Download library
          flutter pub get
        shell: powershell

      - name: Inject Multi-Window C++ Safely
        run: |
          # BACA file bawaan pabrik, JANGAN ditimpa semua
          $mainCpp = "windows\runner\main.cpp"
          $content = Get-Content -Path $mainCpp -Raw
          
          # SUNTIKKAN header plugin
          $content = $content -replace '#include "flutter_window.h"', "#include `"flutter_window.h`"`n#include <desktop_multi_window/desktop_multi_window_plugin.h>"
          
          # SUNTIKKAN kode pemecah layar
          $content = $content -replace 'int show_command\) \{', "int show_command) {`n  if (desktop_multi_window_plugin::DesktopMultiWindowPlugin::HandleWindow(command_line)) {`n    return EXIT_SUCCESS;`n  }"
          
          # SIMPAN perubahannya
          Set-Content -Path $mainCpp -Value $content
        shell: powershell

      - name: Build Windows App
        run: flutter build windows --release

      - name: Zip Build Output
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Software-Pengumuman-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-pengumuman-flutter
          path: Software-Pengumuman-Windows.zip
