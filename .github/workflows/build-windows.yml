name: Build Flutter Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean and Create Windows Project
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          flutter create --project-name pengumuman_pro --platforms=windows .
        shell: powershell

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Zip Build Output
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Software-Pengumuman.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-pengumuman-flutter
          path: Software-Pengumuman.zip
