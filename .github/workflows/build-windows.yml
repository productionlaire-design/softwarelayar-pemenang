name: Build Flutter Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean and Recreate Windows Folder
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          flutter clean
          flutter create --project-name pengumuman_pro --platforms=windows .
        shell: powershell

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject Multi-Window C++ Code (FIXED PLUGIN REGISTRATION)
        run: |
          $code = @"
          #include <flutter/dart_project.h>
          #include <flutter/flutter_view_controller.h>
          #include <windows.h>
          #include "flutter_window.h"
          #include "utils.h"
          #include "generated_plugin_registrant.h" // <--- INI BARIS YANG SAYA LUPA SEBELUMNYA
          #include <desktop_multi_window/desktop_multi_window_plugin.h>

          int APIENTRY wWinMain(_In_ HINSTANCE instance, _In_opt_ HINSTANCE prev, _In_ wchar_t *command_line, _In_ int show_command) {
            if (desktop_multi_window_plugin::DesktopMultiWindowPlugin::HandleWindow(command_line)) {
              return EXIT_SUCCESS;
            }
            HWND hwnd = ::FindWindow(L"FLUTTER_RUNNER_WIN32_WINDOW", L"Pengumuman Pro");
            if (hwnd != NULL) {
              ::ShowWindow(hwnd, SW_NORMAL);
              ::SetForegroundWindow(hwnd);
              return EXIT_FAILURE;
            }
            ::CoInitializeEx(nullptr, COINIT_APARTMENTTHREADED);
            flutter::DartProject project(L"data");
            std::vector<std::string> command_line_arguments = GetCommandLineArguments();
            project.set_dart_entrypoint_arguments(std::move(command_line_arguments));
            FlutterWindow window(project);
            Win32Window::Point origin(10, 10);
            Win32Window::Size size(1280, 720);
            if (!window.Create(L"Pengumuman Pro", origin, size)) {
              return EXIT_FAILURE;
            }
            window.SetQuitOnClose(true);

            RegisterPlugins(&window); // <--- DAN BARIS INI UNTUK MENGHIDUPKAN PLUGINNYA

            ::MSG msg;
            while (::GetMessage(&msg, nullptr, 0, 0)) {
              ::TranslateMessage(&msg);
              ::DispatchMessage(&msg);
            }
            ::CoUninitialize();
            return EXIT_SUCCESS;
          }
          "@
          Set-Content -Path windows\runner\main.cpp -Value $code
        shell: powershell

      - name: Build Windows App
        run: flutter build windows --release

      - name: Zip Build Output
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Software-Pengumuman-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-pengumuman-flutter
          path: Software-Pengumuman-Windows.zip
